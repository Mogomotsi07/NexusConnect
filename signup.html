<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - NexusConnect</title>
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card animate-fade-in">
      <a href="index.html" class="logo">
        <div class="logo-icon">N</div>
        NexusConnect
      </a>
      <h2>Create Account</h2>
      <p class="subtitle">Join the NexusConnect community today</p>

      <form id="signupForm">
        <div class="form-group">
          <label class="form-label">Full Name <span class="required">*</span></label>
          <input type="text" class="form-input" id="name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address <span class="required">*</span></label>
          <input type="email" class="form-input" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Institution / Organization</label>
          <input type="text" class="form-input" id="institution" placeholder="e.g. University of Botswana">
        </div>
        <div class="form-group">
          <label class="form-label">Password <span class="required">*</span></label>
          <input type="password" class="form-input" id="password" placeholder="Min 6 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password <span class="required">*</span></label>
          <input type="password" class="form-input" id="confirmPassword" placeholder="Repeat password" required>
        </div>
        <div class="form-group">
          <label class="form-label">Referral Code (optional)</label>
          <input type="text" class="form-input" id="referralCode" placeholder="e.g. NEX123ABC">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="signupBtn">
          <span>Create Account</span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const institution = document.getElementById('institution').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const referralCode = document.getElementById('referralCode').value.trim().toUpperCase();

      if (password !== confirmPassword) {
        Toast.show('error', 'Password Mismatch', 'Passwords do not match. Please try again.');
        return;
      }

      const btn = document.getElementById('signupBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner spinner-sm"></div>';

      setTimeout(() => {
        const result = Auth.signup({ name, email, institution, password, referralCode });
        if (result.success) {
          Toast.show('success', 'Account Created!', 'Welcome to NexusConnect! Redirecting...');
          setTimeout(() => window.location.href = 'dashboard.html', 1200);
        } else {
          Toast.show('error', 'Sign Up Failed', result.message);
          btn.disabled = false;
          btn.innerHTML = '<span>Create Account</span>';
        }
      }, 600);
    });
  </script>
</body>
</html>
